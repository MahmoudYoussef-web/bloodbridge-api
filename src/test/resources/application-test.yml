spring:
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:bloodbridge_test;DB_CLOSE_DELAY=-1;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  flyway:
    enabled: false

bloodbridge:
  redis:
    enabled: false
  fastapi:
    url: http://localhost:1
    connect-timeout: 100
    read-timeout: 100
  scoring:
    ml-enabled: false

logging:
  level:
    com.bloodbridge: DEBUG
    org.springframework.security: WARN
