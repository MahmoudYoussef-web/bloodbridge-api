server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: bloodbridge

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:bloodbridge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 20
          fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
      key-prefix: "bb:"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

logging:
  level:
    com.bloodbridge.bloodbridge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: bloodbridge
    export:
      prometheus:
        enabled: true
        step: 30s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
      percentiles:
        http.server.requests: 0.5, 0.75, 0.90, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.bloodbridge.bloodbridge

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 120s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
    instances:
      fastApiService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
    instances:
      fastApiRetry:
        base-config: default
      dbRetry:
        max-attempts: 2
        wait-duration: 100ms
  bulkhead:
    instances:
      notificationBulkhead:
        max-concurrent-calls: 5
        max-wait-duration: 500ms
      broadcastBulkhead:
        max-concurrent-calls: 3
        max-wait-duration: 1s
  timelimiter:
    instances:
      fastApiTimeLimiter:
        timeout-duration: 10s

bloodbridge:
  redis:
    enabled: true
    jwt-blacklist-ttl-hours: 24
    jwt-blacklist-enabled: true

  jwt:
    secret: ${JWT_SECRET:YXNkZmdoamtsO3BnYmlucHZ6eGNtdmJnZnJkYXNkZmdoamtscXdlcnR5dWlvcGFzZGZnaGprbHhjemJ2}
    expiration: 86400000
    refresh-expiration: 604800000

  fastapi:
    url: ${FASTAPI_URL:http://localhost:8001}
    connect-timeout: 5000
    read-timeout: 8000

  scoring:
    ml-enabled: false
    exploration-ratio: 0.20
    max-notifications-per-broadcast: 20
    score-staleness-days: 7
    min-history-for-exploitation: 5

  broadcast:
    donor-safety-multiplier-normal: 2.0
    donor-safety-multiplier-critical: 2.5
    critical-radius-multiplier: 3
    radius-expansion-step-km: 5
    max-search-radius-km: 25
    notification-cooldown-critical-hours: 0.5
    notification-cooldown-normal-hours: 2.0

  qrcode:
    expiration-hours: 168
    size: 300

  cleanup:
    stale-critical-hours: 8
    stale-normal-hours: 48
    expire-hours: 48

  schedule:
    cleanup-stale-responses-rate: 3600000
    expire-blood-requests-rate: 43200000
    decay-epsilon-cron: "0 0 0 * * MON"

  rate-limit:
    qr-scan-per-minute: 30
    contact-per-minute: 3
    email-verification-per-minute: 6

  map:
    default-lat: 31.5
    default-lng: 34.4667
    lat-min: 31.2
    lat-max: 32.6
    lng-min: 34.2
    lng-max: 35.6

  cors:
    allowed-origins: "*"
