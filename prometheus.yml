global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bloodbridge-app'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*'
        target_label: application
        replacement: 'bloodbridge'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
